<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>Contractez Copilot</title>
  <style>
    :root {
      --ink: #142340; --brand: #2b4acb; --ok: #15803d; --err: #b91c1c; --muted: #64748b;
      --bg: #ffffff; --fg: #0f172a; --line: #e2e8f0; --soft: #f8fafc;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --fg: #e2e8f0; --line: #334155; --soft: #1e293b; --muted: #94a3b8; --ok: #4ade80; --err: #f87171; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; width: 300px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: var(--ink); color: #fff; }
    header img { width: 22px; height: 22px; border-radius: 6px; }
    header b { flex: 1; font-size: 14px; }
    main { padding: 12px 14px 14px; }
    .conn { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); margin-top: 5px; flex: none; }
    .dot.ok { background: #22c55e; } .dot.err { background: #ef4444; } .dot.paused { background: #94a3b8; }
    .conn small { display: block; color: var(--muted); word-break: break-all; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; font-weight: 700; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .stat { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
    .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 11px; }
    .error { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: #fef2f2; color: var(--err); font-size: 12px; display: none; }
    @media (prefers-color-scheme: dark) { .error { background: #450a0a; } }
    .row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    .switch { position: relative; width: 38px; height: 22px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #cbd5e1; border-radius: 999px; cursor: pointer; transition: background .15s; }
    .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s; }
    input:checked + .slider { background: #f59e0b; }
    input:checked + .slider::before { transform: translateX(16px); }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn { flex: 1; text-align: center; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 600; cursor: pointer; background: transparent; font: inherit; font-weight: 600; }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn:hover { filter: brightness(.97); }
    .rules { margin-top: 12px; color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="">
    <b>Contractez Copilot</b>
  </header>
  <main>
    <div class="conn">
      <span id="dot" class="dot"></span>
      <div><span id="connText">Verific conexiunea…</span><small id="baseUrl"></small></div>
    </div>

    <h2>Azi</h2>
    <div class="grid">
      <div class="stat"><b id="sRead">0</b><span>citite</span></div>
      <div class="stat"><b id="sNew">0</b><span>trimise noi</span></div>
      <div class="stat"><b id="sDup">0</b><span>duplicate</span></div>
      <div class="stat"><b id="sThreads">0</b><span>conversații verificate</span></div>
    </div>
    <div id="queued" class="rules"></div>
    <div id="error" class="error"></div>

    <div class="row">
      <span><b>Pauză</b><br><small style="color:var(--muted)">Nu citesc și nu trimit nimic.</small></span>
      <label class="switch" title="Pauză">
        <input id="paused" type="checkbox">
        <span class="slider"></span>
      </label>
    </div>

    <div class="actions">
      <a id="leads" class="btn primary" target="_blank" rel="noopener noreferrer" href="https://contractez.ro/admin/leads">Lead-uri</a>
      <button id="options" class="btn" type="button">Opțiuni</button>
    </div>

    <p class="rules">Extensia doar citește ce derulezi tu. Mesajele le trimiți manual (max. ~20/zi), după ce citești bannerul din Messenger.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
