# /etc/nginx/conf.d/contractez-cache.conf — contextul `http` (inclus de nginx.conf pe VPS).
# Cache scurt (microcache) pentru paginile publice ale contractez.ro, servite vizitatorilor fără cookie-uri.
# Vezi infra/nginx/README.md pentru ce se cache-uiește, ce nu și cum se verifică.

proxy_cache_path /var/cache/nginx/contractez levels=1:2 keys_zone=contractez:20m max_size=512m inactive=7d use_temp_path=off;

# Orice cookie (sesiune `sid`, acord cookie-uri, VisitTrack, Crisp) = răspuns personalizat: fără cache.
map $http_cookie $contractez_has_cookie {
    default 1;
    ""      0;
}

# Crawlerele trec mereu pe la aplicație: proxy.ts le raportează la VisitTrack (statistica de crawl AI),
# iar Next le servește metadatele blocant în <head>.
map $http_user_agent $contractez_is_bot {
    default 0;
    "~*(bot|crawl|spider|slurp|archiver|facebookexternalhit|embedly|preview|gptbot|chatgpt|claude|anthropic|perplexity|google-extended|applebot|bingpreview|yandex|baidu|duckduck|ccbot|bytespider|amazonbot|meta-external|cohere|diffbot|petalbot|semrush|ahrefs|mj12)" 1;
}

# Doar paginile publice de conținut (fără contoare de vizualizări, fără date de cont).
map $uri $contractez_public_page {
    default 0;
    "~^/$"                                                             1;
    "~^/(categorii|orase|blog)(/|$)"                                   1;
    "~^/(ghid-preturi|despre|cum-functioneaza|preturi|termeni|confidentialitate|contact)$" 1;
    "~^/(llms\.txt|llms-full\.txt|sitemap\.xml|robots\.txt)$"          1;
}

map "$contractez_public_page:$contractez_has_cookie:$contractez_is_bot" $contractez_skip_cache {
    default 1;
    "1:0:0" 0;
}
