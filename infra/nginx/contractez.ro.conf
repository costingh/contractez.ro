# /etc/nginx/sites-available/contractez.ro — reverse proxy către containerul web de pe 127.0.0.1:3700 (/opt/contractez).
# Certbot gestionează blocul TLS. Necesită infra/nginx/contractez-cache.conf în /etc/nginx/conf.d/.
# Atenție: proxy_set_header se moștenește doar dacă blocul curent nu are propriile proxy_set_header,
# de aceea fiecare `location` le repetă pe toate.

server {
    server_name contractez.ro www.contractez.ro;

    client_max_body_size 10M;
    server_tokens off;

    # IP-ul real al vizitatorului când traficul vine prin Cloudflare (vezi cloudflare-realip.conf).
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # www → domeniul principal
    if ($host = www.contractez.ro) {
        return 301 https://contractez.ro$request_uri;
    }

    # Resursele de build au hash în nume și sunt imutabile: le ține nginx, fără drum până la Node.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache contractez;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Aplicația ia primul IP din X-Forwarded-For (rate limit, sesiuni): îl suprascriem, nu îl extindem.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;

        # Microcache: paginile publice, pentru vizitatorii fără cookie-uri (de obicei prima vizită din Google), 60 s,
        # reîmprospătate în fundal. Next trimite `no-store` pe paginile dinamice, deci îl ignorăm aici;
        # răspunsurile cu Set-Cookie nu se cache-uiesc niciodată (Set-Cookie NU e în proxy_ignore_headers).
        # Variantele RSC (navigare în aplicație) sunt separate prin cheie și prin Vary-ul trimis de Next.
        proxy_cache contractez;
        proxy_cache_key "$scheme$host$request_uri|$http_rsc|$http_next_router_prefetch|$http_next_router_segment_prefetch|$http_next_router_state_tree";
        proxy_cache_bypass $contractez_skip_cache;
        proxy_no_cache $contractez_skip_cache;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:3700/api/health;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/contractez.ro/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/contractez.ro/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.contractez.ro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = contractez.ro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name contractez.ro www.contractez.ro;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot
}
